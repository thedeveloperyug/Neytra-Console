name: Render Neytra logo PNG
on:
  push:
    branches: [master]
    paths:
      - assets/branding/logo/neytra_n.svg
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg pillow
      - name: Render transparent PNG
        run: |
          python - <<'PY'
          import io
          import cairosvg
          from PIL import Image, PngImagePlugin
          svg = "assets/branding/logo/neytra_n.svg"
          png = "assets/branding/logo/neytra_n.png"
          raw = cairosvg.svg2png(url=svg, output_width=2048, output_height=2048)
          image = Image.open(io.BytesIO(raw)).convert("RGBA")
          meta = PngImagePlugin.PngInfo()
          meta.add_text("Copyright", "Copyright (c) 2026 Neytra Intelligence Platform. All rights reserved.")
          meta.add_text("License", "Proprietary and confidential. Unauthorized use, reproduction, or distribution is prohibited.")
          image.save(png, pnginfo=meta, optimize=True)
          PY
      - name: Commit rendered PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/logo/neytra_n.png
          git diff --cached --quiet && exit 0
          git commit -m "Render Neytra N transparent PNG"
          git push origin master
