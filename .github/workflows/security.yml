name: Neytra Console Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub deps
      - name: Reject committed private key material
        run: |
          if git grep -nE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[[:alnum:]_-]{30,}|hf_[[:alnum:]]{20,}|sk-[[:alnum:]_-]{20,}' -- ':!*.md'; then
            echo "Potential credential material found."
            exit 1
          fi
