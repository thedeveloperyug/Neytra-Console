name: Publish Neytra Console Web

on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/release-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neytra-web-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Flutter web
        run: >
          flutter build web
          --release
          --base-href "/Neytra-Console/"
          --dart-define=NEYTRA_ENV=production

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Publish build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy Neytra Console web preview"
